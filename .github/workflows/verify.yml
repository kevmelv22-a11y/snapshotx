name: Verify Expo app

on:
  pull_request:
    branches: [main, feat/snaplion-staff-console]
  push:
    branches: [main, feat/snaplion-staff-console]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx expo lint
      - name: Expo compatibility
        run: npx expo-doctor
