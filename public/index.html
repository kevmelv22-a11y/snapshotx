<!DOCTYPE html>
<html lang="nl" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <!-- Stop Safari / Google auto-translate from mangling the Dutch UI. -->
    <meta name="google" content="notranslate" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SnapShot X</title>
    <!-- SEO + link previews (WhatsApp, iMessage, X, Discord) for snapshot-x.nl and shared /add/<username> links. -->
    <meta name="description" content="SnapShot X: snaps, stories en chat met je vrienden. Chat, bel en voeg vrienden toe op snapshot-x.nl." />
    <meta name="theme-color" content="#08090E" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="SnapShot X" />
    <meta name="apple-mobile-web-app-title" content="SnapShot X" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SnapShot X" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="SnapShot X" />
    <meta property="og:description" content="Snaps, stories en chat met je vrienden." />
    <meta property="og:url" content="https://snapshot-x.nl/" />
    <meta property="og:image" content="https://snapshot-x.nl/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SnapShot X-logo met de tekst: Snaps, stories en chat met je vrienden." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnapShot X" />
    <meta name="twitter:description" content="Snaps, stories en chat met je vrienden." />
    <meta name="twitter:image" content="https://snapshot-x.nl/icons/og-image.png" />
    <link rel="canonical" href="https://snapshot-x.nl/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Zet JavaScript aan om SnapShot X te gebruiken.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root" translate="no"></div>
</body>
</html>
